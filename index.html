<style>
:root{
  --bg:#eef2fa; --ink:#141a2e; --muted:#5d6580; --card:#fff;

  color:#fff;font-weight:700;font-size:1rem;cursor:pointer;font-family:inherit}

.loader{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#29a9dc;transition:opacity .7s ease}
.loader.out{opacity:0;pointer-events:none}

.ld-2{display:block;margin-top:.35em;font-weight:500;font-size:clamp(18px,3vw,30px);letter-spacing:.3em;animation:ld-focus 1.6s cubic-bezier(.2,.7,.2,1) .45s both}

/* ---------- page ---------- */
#app{display:none}

@container (max-width:820px){.quota{grid-template-columns:repeat(2,1fr)}}
@container (max-width:400px){.quota{grid-template-columns:1fr}}
.quota .q{background:var(--soft);border-radius:14px;padding:20px 12px 16px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.q-ico{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:#fff;color:var(--main)}
.q-ico .ico{width:28px;height:28px}
.q-name{font-weight:700;font-size:.95rem}
.q-num{white-space:nowrap;display:flex;align-items:baseline;justify-content:center;gap:3px;color:var(--main);font-weight:900;font-size:1.9rem;line-height:1.1}
.q-num small{font-size:.75rem;font-weight:700;color:var(--muted)}
.q-num .inf{width:30px;height:30px;align-self:center}
.q-num:has(.inf){align-items:center;font-size:1.3rem}
.q-note{font-size:.78rem;color:var(--muted);white-space:nowrap}
.news-list{list-style:none;margin:0;padding:0}
.news-list.scrollable{overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;border-bottom:1px solid var(--line)}
.news-more{margin:10px 0 0;font-size:.85rem;color:var(--muted)}
.news-list.scrollable:focus-visible{outline:2px solid var(--main);outline-offset:4px}
.news-list li{display:grid;grid-template-columns:7.5em 1fr;gap:16px;padding:12px 0;border-top:1px solid var(--line)}
.news-list li:first-child{border-top:0}
.news-list time{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums;padding-top:.1em}
.news-list p{margin:0;white-space:pre-line;overflow-wrap:anywhere}
.news-list a{color:var(--main)}
.news-empty{margin:0;color:var(--muted)}
.news-list:has(li) ~ .news-empty{display:none}
@media (max-width:640px){.news-list li{grid-template-columns:1fr;gap:2px}}
.scroll{overflow-x:auto}
.spec{min-width:560px}
.foot{text-align:center;color:var(--muted);font-size:.8rem;padding:20px 16px 40px}
.foot a{color:var(--main)}
/* ---------- 語言切換（不用國旗，以各語言自稱標示） ---------- */
.lang-sw{position:relative;z-index:20;font-family:"Noto Sans",var(--cjk),sans-serif;line-height:1.4}
.lang-btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px 0 10px;border:1px solid rgba(255,255,255,.7);border-radius:99px;
  background:rgba(255,255,255,.92);color:var(--ink);font:inherit;font-size:.86rem;font-weight:500;cursor:pointer;
  box-shadow:0 4px 14px rgba(10,40,90,.18);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.lang-btn:focus-visible,.lang-menu a:focus-visible{outline:2px solid var(--main);outline-offset:2px}
.lang-btn .g{width:18px;height:18px;color:var(--main);flex:none}
.lang-btn .c{width:10px;height:10px;opacity:.6;transition:transform .2s}
.lang-btn[aria-expanded="true"] .c{transform:rotate(180deg)}
.lang-menu{position:absolute;right:0;top:calc(100% + 6px);min-width:148px;margin:0;padding:6px;list-style:none;background:#fff;
  border-radius:14px;box-shadow:0 12px 32px rgba(10,30,90,.24)}
.lang-menu[hidden]{display:none}
.lang-menu a{display:block;padding:8px 12px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:.92rem;white-space:nowrap}
.lang-menu a:hover{background:var(--soft);color:var(--main)}
.lang-menu a[aria-current]{color:var(--main);font-weight:700}
.lang-menu a[aria-current]::after{content:" ✓"}
.lang-gate{position:fixed;top:16px;right:16px}
.hero-wrap{position:relative}
.lang-kv{position:absolute;top:16px;right:max(16px, calc((100% - 960px) / 2 + 16px))}
@media (max-width:640px){                       /* SP：KV 面板右側空間有限 → 只顯示地球圖示 */
  .lang-kv{top:10px;right:8px}
  .lang-kv .lang-btn{width:40px;height:40px;padding:0;justify-content:center}
  .lang-kv .lang-btn .t,.lang-kv .lang-btn .c{display:none}
  .lang-kv .lang-btn .g{width:20px;height:20px}
}
@media (max-width:359px){.lang-kv{top:auto;bottom:12px}.lang-kv .lang-menu{top:auto;bottom:calc(100% + 6px)}}
.toc-lang{display:none}
.nav-compact .toc-lang{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding:16px 4px 0;border-top:1px solid var(--line)}
.nav-compact .toc-lang .h{width:100%;display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);font-weight:700;letter-spacing:.06em}
.nav-compact .toc-lang .h svg{width:16px;height:16px;color:var(--main)}
.nav-compact .toc .toc-lang a{font-size:.88rem;padding:6px 12px;border:1px solid var(--line);border-radius:99px}
.nav-compact .toc .toc-lang a[aria-current]{background:var(--main);border-color:var(--main);color:#fff}
</style>
</head>

function goLang(code){                                   // 重新載入（登入狀態保留在 sessionStorage），停在目前段落
  try { localStorage.setItem("kk_lang", code); } catch {}
  const u = new URL(location.href); u.searchParams.set("lang", code);
  const act = document.querySelector(".toc a.active");
  u.hash = act ? act.getAttribute("href") : (location.hash || "");
  location.assign(u.href);
}
function langLinks(){
  return LANGS.map(l => {
    const a = document.createElement("a");
    a.href = "?lang=" + l.code; a.lang = I18N[l.code]?.html || l.code; a.hreflang = a.lang; a.textContent = l.name;
    if (l.code === CUR.code) a.setAttribute("aria-current", "true");
    a.addEventListener("click", e => { e.preventDefault(); if (l.code !== CUR.code) goLang(l.code); });
    return a;
  });
}
function langSwitcher(cls){
  if (LANGS.length < 2) return null;
  const wrap = document.createElement("div"); wrap.className = "lang-sw " + cls;
  const btn = document.createElement("button"); btn.type = "button"; btn.className = "lang-btn";
  btn.setAttribute("aria-haspopup", "true"); btn.setAttribute("aria-expanded", "false");
  btn.setAttribute("aria-label", `${T.lang}: ${CUR.name}`); btn.title = T.lang;
  btn.innerHTML = GLOBE + '<span class="t"></span><svg class="c" viewBox="0 0 10 10" aria-hidden="true"><path d="M1 3l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';
  btn.querySelector(".t").textContent = CUR.name;
  const menu = document.createElement("ul"); menu.className = "lang-menu"; menu.hidden = true;
  langLinks().forEach(a => { const li = document.createElement("li"); li.append(a); menu.append(li); });
  const set = open => { menu.hidden = !open; btn.setAttribute("aria-expanded", String(open)); };
  btn.onclick = () => set(menu.hidden);
  document.addEventListener("click", e => { if (!wrap.contains(e.target)) set(false); });
  addEventListener("keydown", e => { if (e.key === "Escape" && !menu.hidden) { set(false); btn.focus(); } });
  wrap.append(btn, menu);
  return wrap;
}

/* 解密內容：新格式 {v:2, pages:{語言:HTML}}，舊格式為單一 HTML */
function pickPage(txt){
  try { const j = JSON.parse(txt); if (j?.v === 2) return j.pages[CUR.code] ?? Object.values(j.pages)[0]; } catch {}
  return txt;
}
const AUTH_KEY = "kk_auth:" + location.pathname.replace(/index\.html$/, "");
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(id, pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(id + ":" + pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const buf = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.data));
  return pickPage(new TextDecoder().decode(buf));
}

    const sw = langSwitcher("lang-kv"); if (sw) w.append(sw);
  }
  const vis = app.querySelector(".hero-visual");
  if (vis) initWater(vis, loaderDone);
  initNav(app);
  initNews(app);
  if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
}
/* ---------- 登入後 loading：海洋＋文字柔焦浮現，3 秒後淡出 ---------- */
function showLoader(onDone){
  const el = document.createElement("div");
  el.className = "loader"; el.setAttribute("role", "status"); el.setAttribute("aria-label", T.loading);
  el.innerHTML = '<div class="ld-txt"><span class="ld-1">kkamdol</span><span class="ld-2">Kiss・Hug</span></div>';
  document.body.append(el); document.body.classList.add("loading");
  const water = initWater(el);
  setTimeout(() => {
    water?.stop();                                    // 淡出時先停住海面，讓淡出順暢
    el.classList.add("out");
    setTimeout(() => { el.querySelector("canvas")?.getContext("webgl")?.getExtension("WEBGL_lose_context")?.loseContext(); el.remove(); document.body.classList.remove("loading"); onDone?.(); }, 700);
  }, 3000);
}
/* ---------- 最新消息：最多顯示三則，其餘捲動 ---------- */
function initNews(app){
  const list = app.querySelector(".news-list"); if (!list) return;
  const MAX = 3; let more = null;
  const fit = () => {
    const items = list.querySelectorAll("li");
    if (items.length <= MAX) { list.classList.remove("scrollable"); list.style.maxHeight = ""; list.removeAttribute("tabindex"); more?.remove(); more = null; return; }
    list.style.maxHeight = "";
    const h = items[MAX - 1].getBoundingClientRect().bottom - list.getBoundingClientRect().top;
    list.style.maxHeight = Math.ceil(h) + "px";
    list.classList.add("scrollable"); list.tabIndex = 0; list.setAttribute("aria-label", T.news);
    if (!more) { more = document.createElement("p"); more.className = "news-more"; list.after(more); }
    more.textContent = T.newsMore(items.length);
  };
  fit(); addEventListener("resize", fit); document.fonts?.ready.then(fit);
}
/* ---------- 導覽：PC 懸浮＋目前位置／SP 漢堡選單 ---------- */
function initNav(app){
  const toc = app.querySelector(".toc"); if (!toc) return;
  toc.id = "site-nav";
  const btn = document.createElement("button");
  btn.className = "nav-btn"; btn.type = "button";
  btn.setAttribute("aria-label", T.navOpen); btn.setAttribute("aria-controls", "site-nav"); btn.setAttribute("aria-expanded", "false");
  btn.innerHTML = "<span></span>";
  if (LANGS.length > 1) {                          // SP 漢堡選單最下面的語言切換
    const box = document.createElement("div"); box.className = "toc-lang";
    const h = document.createElement("span"); h.className = "h"; h.innerHTML = GLOBE.replace('class="g" ', ""); h.append(T.lang);
    box.append(h, ...langLinks()); toc.append(box);
  }
  const bd = document.createElement("div"); bd.className = "nav-backdrop";
  app.append(btn, bd);
  const set = open => {
    document.body.classList.toggle("nav-open", open);
    btn.setAttribute("aria-expanded", String(open)); btn.setAttribute("aria-label", open ? T.navClose : T.navOpen);
  };
  btn.onclick = () => set(!document.body.classList.contains("nav-open"));
  bd.onclick = () => set(false);
  toc.addEventListener("click", e => { if (e.target.closest("a")) set(false); });
  addEventListener("keydown", e => { if (e.key === "Escape") set(false); });
  // 目錄放不下時切換成漢堡選單（依實際寬度判斷，不限裝置）
  let need = 0;
  const measure = () => {                          // 量目錄完整寬度（只在初始化與字型載入後）
    const b = document.body, was = b.classList.contains("nav-compact");
    b.classList.add("nav-measuring"); b.classList.remove("nav-compact");
    need = toc.scrollWidth + 32;                   // ＋左右留白
    b.classList.toggle("nav-compact", was); void toc.offsetWidth;
    requestAnimationFrame(() => b.classList.remove("nav-measuring"));
  };
  const fit = () => {
    const compact = need > document.documentElement.clientWidth;
    if (!compact && document.body.classList.contains("nav-open")) set(false);
    document.body.classList.toggle("nav-compact", compact);
  };
  measure(); fit(); addEventListener("resize", fit);
  document.fonts?.ready.then(() => { measure(); fit(); });
  // 漢堡按鈕：KV 從畫面消失後才出現
  const hero = app.querySelector(".hero");
  if (hero) new IntersectionObserver(([e]) => document.body.classList.toggle("kv-in-view", e.isIntersecting)).observe(hero);
  // 目前位置標示
  const links = [...toc.querySelectorAll('a[href^="#"]')];
  const map = new Map(links.map(a => [a.getAttribute("href").slice(1), a]));
  const secs = [...map.keys()].map(id => document.getElementById(id)).filter(Boolean);
  const mark = () => {
    let cur = secs[0];
    for (const s of secs) if (s.getBoundingClientRect().top < innerHeight * 0.35) cur = s;
    links.forEach(a => a.classList.toggle("active", map.get(cur?.id) === a));
    const act = map.get(cur?.id);
    if (act && getComputedStyle(toc).flexDirection === "row") toc.scrollTo({left: act.offsetLeft - toc.clientWidth/2 + act.clientWidth/2, behavior: "smooth"});
  };
  addEventListener("scroll", mark, {passive:true}); mark();
}
/* ---------- 主視覺：海底波光 (WebGL) ---------- */
function initWater(hero, waitFor){
  const cv = document.createElement("canvas"); cv.className = "water"; cv.setAttribute("aria-hidden","true");
  const gl = cv.getContext("webgl", {antialias:false, premultipliedAlpha:false});
  if (!gl) return;                       // 不支援 → 保留單色背景
  hero.prepend(cv);
  const vs = "attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}";
  const fs = `precision mediump float;
uniform vec2 R; uniform float T;
float hash(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
  return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y);
}
float fbm(vec2 p){ float v = 0.0, a = 0.5; for(int k=0;k<5;k++){ v += a*noise(p); p = p*2.03 + 7.1; a *= 0.5; } return v; }
vec2 hash2(vec2 p){ return vec2(hash(p), hash(p+19.19)); }
// 柔焦光斑（Worley）：每顆大小隨機、緩慢游移；回傳 (核心亮度, 光暈)
vec2 dapple(vec2 p, float t){
  vec2 i = floor(p), f = fract(p); float core = 0.0, glow = 0.0;
  for(int y=-1;y<=1;y++) for(int x=-1;x<=1;x++){
    vec2 n = vec2(float(x), float(y)); vec2 h = hash2(i+n);
    float r = mix(0.20, 0.85, pow(hash(i+n+7.7), 1.4));      // 隨機半徑：小光點多、大光斑少
    vec2 o = 0.5 + 0.34*sin(t*0.6 + 6.2831*h);
    float d = length(n + o - f);
    core = max(core, (1.0 - smoothstep(r*0.12, r, d)) * (0.75 + 0.25*h.x));   // 邊緣拉長＝更模糊
    glow += exp(-d*d / (r*r) * 1.2) * r;                     // 外圍大光暈
  }
  return vec2(core, glow);
}
void main(){
  vec2 uv = gl_FragCoord.xy / R;
  float asp = R.x / R.y;
  vec2 q = vec2(uv.x*asp, uv.y) * 0.95;                       // zoom in
  float t = T;
  vec2 w = vec2(fbm(q*1.2 + vec2(t*0.04, 0.0)), fbm(q*1.2 + vec2(0.0, t*0.05) + 4.7)) - 0.5;
  float mask = smoothstep(0.30, 0.62, fbm(vec2(q.x*1.1, q.y*2.6) + 1.3*w + vec2(t*0.06, -t*0.02)));
  vec2 s1 = vec2(q.x*2.8, q.y*5.6) + 2.2*w + vec2(t*0.20, 0.0);
  vec2 s2 = vec2(q.x*5.0, q.y*9.5) + 2.6*w - vec2(t*0.15, t*0.04);
  vec2 d1 = dapple(s1, t), d2 = dapple(s2, t*1.2 + 3.0);
  float light = clamp(mask*(d1.x*1.25 + d2.x*0.7) + (1.0-mask)*d2.x*0.18 + mask*0.15, 0.0, 1.0);
  float bloom = mask*(d1.y*0.9 + d2.y*0.45) + (1.0-mask)*d2.y*0.12;
  float swell = fbm(vec2(q.x*0.8, q.y*1.6) + vec2(t*0.03, 0.0));
  vec3 deep = vec3(0.02, 0.47, 0.78);
  vec3 aqua = vec3(0.14, 0.72, 0.93);
  vec3 col = mix(deep, aqua, 0.25 + 0.75*smoothstep(0.25, 0.75, swell));
  col *= 0.84 + 0.16*smoothstep(0.0, 0.9, length(vec2(uv.x, 1.0-uv.y)));   // 左上偏深
  col = mix(col, vec3(0.86, 0.98, 1.0), light*0.88);
  col += vec3(0.50, 0.80, 1.0) * bloom * 0.42;                 // bloom 光暈
  col += vec3(1.0) * pow(light, 2.5) * 0.25;                   // 最亮處溢光
  gl_FragColor = vec4(min(col, vec3(1.0)), 1.0);
}`;
  const sh = (type, src) => { const o = gl.createShader(type); gl.shaderSource(o, src); gl.compileShader(o); return o; };
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) { cv.remove(); return; }
  gl.useProgram(pr);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, "a"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const uR = gl.getUniformLocation(pr, "R"), uT = gl.getUniformLocation(pr, "T");
  const resize = () => {
    const d = Math.min(devicePixelRatio || 1, 1.5);
    cv.width = Math.round(hero.clientWidth * d); cv.height = Math.round(hero.clientHeight * d);
    gl.viewport(0, 0, cv.width, cv.height); gl.uniform2f(uR, cv.width, cv.height);
  };
  resize(); addEventListener("resize", resize);
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let visible = true, raf = 0; const t0 = performance.now();
  const draw = now => { gl.uniform1f(uT, (now - t0) / 1000 * 0.5 + 10.0); gl.drawArrays(gl.TRIANGLES, 0, 3); };
  const loop = now => { draw(now); raf = visible ? requestAnimationFrame(loop) : 0; };
  const stop = () => {                                  // 停止動畫並釋放 WebGL 資源
    visible = false; cancelAnimationFrame(raf); raf = 0; removeEventListener("resize", resize); io?.disconnect();
  };
  let io = null;
  if (still) { draw(t0); return { stop }; }
  const start = () => {
    io = new IntersectionObserver(([e]) => { visible = e.isIntersecting; if (visible && !raf) raf = requestAnimationFrame(loop); });
    io.observe(hero);
    raf = requestAnimationFrame(loop);
  };
  if (waitFor) { draw(t0); waitFor.then(start); } else start();   // loading 期間先停在第一格
  return { stop };
}
document.getElementById("login").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("btn"), err = document.getElementById("err");

  btn.disabled = true; err.textContent = "";
  try {

});
