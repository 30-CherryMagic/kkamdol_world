<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>깜돌 WORLDWIDE ANTHOLOGY PROJECT｜繁中資料整理</title>
<style>
:root{
  --bg:#05070f; --ink:#141a2e; --muted:#5d6580; --card:#fff;
  --royal:#1f4fd8; --royal-d:#123596; --neon:#39ff14; --line:#e1e6f2; --soft:#eaf0ff;
  --grad:linear-gradient(135deg,#2a5cf0 0%,#1a3fae 30%,#0b1a4d 65%,#05070f 100%);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg) linear-gradient(180deg,#0a1433 0%,#05070f 600px) no-repeat;color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.75}
/* ---------- login ---------- */
#gate{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--grad)}
#gate form{background:#fff;border-radius:20px;padding:36px 32px;width:min(380px,100%);
  box-shadow:0 20px 60px rgba(0,0,0,.5)}
#gate h1{margin:0 0 4px;font-size:1.25rem;letter-spacing:.04em}
#gate p{margin:0 0 22px;color:var(--muted);font-size:.9rem}
#gate label{display:block;font-size:.8rem;font-weight:700;color:var(--muted);margin:14px 0 6px;letter-spacing:.08em}
#gate input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:1rem;font-family:inherit}
#gate input:focus{outline:none;border-color:var(--royal);box-shadow:0 0 0 3px rgba(31,79,216,.2)}
#gate button{margin-top:22px;width:100%;padding:12px;border:0;border-radius:10px;background:linear-gradient(120deg,#2a5cf0,#0b1a4d);
  color:#fff;font-weight:700;font-size:1rem;cursor:pointer;font-family:inherit}
#gate button:disabled{opacity:.6;cursor:wait}
#err{color:#d33;font-size:.85rem;min-height:1.3em;margin-top:10px}
/* ---------- page ---------- */
#app{display:none}
.hero{background:var(--grad);color:#fff;text-align:center;padding:64px 20px 56px}
.hero h1{margin:.2em 0;font-size:clamp(1.8rem,5vw,3rem);line-height:1.15;letter-spacing:.02em}
.eyebrow{margin:0;letter-spacing:.2em;font-size:.85rem;color:var(--neon);font-weight:700}
.sub{opacity:.95}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.chips span{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);padding:4px 12px;border-radius:99px;font-size:.85rem}
.toc{position:sticky;top:0;z-index:5;display:flex;gap:4px;overflow-x:auto;padding:10px 16px;
  background:rgba(5,7,15,.85);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.08)}
.toc a{white-space:nowrap;text-decoration:none;color:#c9d4f5;font-size:.88rem;padding:6px 12px;border-radius:99px}
.toc a:hover{background:var(--royal);color:var(--neon)}
main{max-width:960px;margin:0 auto;padding:28px 16px 40px}
.card{background:var(--card);border-radius:18px;padding:28px clamp(18px,4vw,36px);margin-bottom:22px;
  box-shadow:0 6px 24px rgba(0,0,0,.35);scroll-margin-top:64px}
h2{margin:0 0 14px;font-size:1.4rem;display:flex;align-items:center;gap:12px}
.num{font-size:.85rem;color:#fff;background:linear-gradient(135deg,#2a5cf0,#05070f);border-radius:8px;padding:2px 8px}
h3{font-size:1.08rem;margin:24px 0 8px;padding-left:10px;border-left:4px solid var(--royal)}
h4{margin:0 0 6px}
.note{color:var(--muted);font-size:.88rem}
.card strong{background:linear-gradient(transparent 55%,var(--neon) 55%);padding:0 2px}
.callout{background:var(--soft);border-left:5px solid var(--neon);border-radius:12px;padding:14px 18px;margin:16px 0}
.callout.soft{background:linear-gradient(120deg,#eaf0ff,#dde3f3)}
.badge{display:inline-block;background:#fff4d6;border-radius:8px;padding:2px 10px;font-size:.9rem}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;margin:0 0 12px}
.facts div{border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.facts div.hl{border:2px solid var(--neon);background:#0b1a4d;box-shadow:0 0 14px rgba(57,255,20,.35)}
.facts div.hl dt{color:#b8c6f0}
.facts div.hl dd{color:var(--neon)}
.facts dt{font-size:.78rem;color:var(--muted);font-weight:700;letter-spacing:.06em}
.facts dd{margin:0;font-weight:600}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.mini{border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.mini h3{margin-top:0;border:0;padding:0;color:var(--royal)}
.ng{border-radius:14px;padding:14px 18px;background:#fff6f6;border:1px solid #f5d5d5}
.ng h4{color:#c0392b}
.ng li::marker{content:"✕  ";color:#c0392b}
ul.check li::marker{content:"✓  ";color:var(--royal)}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem;margin:8px 0}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}
.tbl th{background:#0b1a4d;color:#fff;font-size:.82rem;letter-spacing:.04em}
.tbl td.todo{color:#b07a00;background:#fffaf0}
.timeline{list-style:none;margin:8px 0 0;padding:0 0 0 28px;position:relative}
.timeline::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:3px;border-radius:3px;
  background:linear-gradient(180deg,var(--royal),#05070f)}
.timeline li{position:relative;padding:0 0 22px 14px;display:flex;flex-direction:column}
.timeline li::before{content:"";position:absolute;left:-25px;top:6px;width:14px;height:14px;border-radius:50%;
  background:#fff;border:3px solid var(--royal)}
.timeline .when{font-size:.82rem;font-weight:700;color:var(--royal);letter-spacing:.04em}
.timeline .what{font-size:1.05rem;background:none;padding:0}
.timeline .desc{color:var(--muted);font-size:.9rem}
.timeline li.key::before{background:var(--neon);border-color:#0b1a4d;box-shadow:0 0 10px var(--neon)}
.timeline li.key .when{display:inline-block;align-self:flex-start;background:#0b1a4d;color:var(--neon);padding:1px 10px;border-radius:6px}
.timeline li.key .what{background:linear-gradient(transparent 55%,var(--neon) 55%);align-self:flex-start;padding:0 2px}
.scroll{overflow-x:auto}
.spec{min-width:560px}
.foot{text-align:center;color:#7d88aa;font-size:.8rem;padding:20px 16px 40px}
.logout{position:fixed;right:14px;bottom:14px;z-index:9;border:0;border-radius:99px;padding:8px 14px;
  background:var(--royal);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.4);cursor:pointer;font-family:inherit;font-size:.8rem}
</style>
</head>
<body>
<div id="gate">
  <form id="login" autocomplete="on">
    <h1>🔒 PLLI 限定頁面</h1>
    <p>請輸入 ID 與 PASSWORD 以瀏覽內容</p>
    <label for="uid">ID</label>
    <input id="uid" name="username" autocomplete="username" required autofocus>
    <label for="pw">PASSWORD</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required>
    <button id="btn" type="submit">登入</button>
    <div id="err" role="alert"></div>
  </form>
</div>
<div id="app"></div>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(id, pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(id + ":" + pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const buf = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.data));
  return new TextDecoder().decode(buf);
}
function render(html){
  const app = document.getElementById("app");
  app.innerHTML = html + '<button class="logout" type="button">登出</button>';
  app.querySelector(".logout").onclick = () => { sessionStorage.removeItem("kk_auth"); location.reload(); };
  document.getElementById("gate").remove();
  app.style.display = "block";
  if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
}
document.getElementById("login").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("btn"), err = document.getElementById("err");
  const id = document.getElementById("uid").value.trim(), pw = document.getElementById("pw").value;
  btn.disabled = true; err.textContent = "";
  try {
    render(await unlock(id, pw));
    sessionStorage.setItem("kk_auth", JSON.stringify([id, pw]));
  } catch { err.textContent = "ID 或 PASSWORD 錯誤"; btn.disabled = false; }
});
(async () => {
  const saved = sessionStorage.getItem("kk_auth");
  if (!saved) return;
  try { render(await unlock(...JSON.parse(saved))); } catch { sessionStorage.removeItem("kk_auth"); }
})();
</script>
