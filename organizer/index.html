<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700;900&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<title>깜돌 WORLDWIDE ANTHOLOGY PROJECT｜繁中資料整理</title>
<style>
:root{
  --bg:#eef2fa; --ink:#141a2e; --muted:#5d6580; --card:#fff;
  --main:#1f4fd8; --main-d:#123596; --neon:#c4fc28; --line:#dde4f2; --soft:#e8eefc;
  --grad:#1f4fd8;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans","Noto Sans TC","Noto Sans JP","Noto Sans KR","Noto Sans SC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.75}
/* ---------- login ---------- */
#gate{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--grad)}
#gate form{background:#fff;border-radius:20px;padding:36px 32px;width:min(380px,100%);
  box-shadow:0 20px 60px rgba(10,25,90,.35)}
#gate h1{margin:0 0 4px;font-size:1.25rem;letter-spacing:.04em}
#gate p{margin:0 0 22px;color:var(--muted);font-size:.9rem}
#gate label{display:block;font-size:.8rem;font-weight:700;color:var(--muted);margin:14px 0 6px;letter-spacing:.08em}
#gate input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:1rem;font-family:inherit}
#gate input:focus{outline:none;border-color:var(--main);box-shadow:0 0 0 3px rgba(31,79,216,.22)}
#gate button{margin-top:22px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--main);
  color:#fff;font-weight:700;font-size:1rem;cursor:pointer;font-family:inherit}
#gate button:disabled{opacity:.6;cursor:wait}
#err{color:#d33;font-size:.85rem;min-height:1.3em;margin-top:10px}
/* ---------- page ---------- */
#app{display:none}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:clamp(24px,4vw,48px);align-items:center;
  max-width:1120px;margin:0 auto;padding:0 clamp(16px,4vw,32px) 44px}
.hero-text{color:var(--ink);padding-top:44px}
.hero h1{margin:.35em 0 .3em;font-size:clamp(1.9rem,4.2vw,3rem);line-height:1.12;letter-spacing:.01em;font-weight:900}
.eyebrow{display:inline-block;margin:0;background:var(--main);color:#fff;font-weight:700;font-size:.8rem;letter-spacing:.14em;
  padding:5px 12px;border-radius:99px}
.sub{color:var(--muted);margin:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.chips span{background:#fff;border:1px solid #d5dcde;color:var(--ink);padding:4px 12px;border-radius:99px;font-size:.85rem;font-weight:500}
.hero-visual{position:relative;align-self:start;aspect-ratio:4/3;overflow:hidden;background:#29a9dc}
.hero-visual canvas.water{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero-wrap{background:var(--card);border-bottom:1px solid var(--line)}
@media (max-width:760px){.hero{grid-template-columns:1fr;gap:0}.hero-visual{order:-1;aspect-ratio:16/9}.hero-text{padding-top:24px}}
.toc{position:sticky;top:14px;z-index:15;display:flex;gap:2px;width:fit-content;max-width:calc(100% - 32px);overflow-x:auto;
  margin:18px auto 0;padding:6px;border-radius:99px;background:rgba(255,255,255,.82);backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);border:1px solid var(--line);box-shadow:0 8px 24px rgba(20,40,100,.12);scrollbar-width:none}
.toc::-webkit-scrollbar{display:none}
.toc a{white-space:nowrap;text-decoration:none;color:var(--ink);font-size:.86rem;padding:7px 14px;border-radius:99px;transition:background .2s,color .2s}
.toc a:hover{background:var(--soft);color:var(--main)}
.toc a.active{background:var(--main);color:#fff}
.nav-btn,.nav-backdrop{display:none}
.nav-measuring .toc,.nav-measuring .toc *{transition:none!important}
  .nav-compact .nav-btn{display:grid;place-items:center;position:fixed;top:12px;right:12px;z-index:30;width:46px;height:46px;border:0;border-radius:50%;
    background:var(--main);color:#fff;box-shadow:0 6px 18px rgba(20,40,100,.3);cursor:pointer}
  .nav-compact .nav-btn span,.nav-compact .nav-btn span::before,.nav-compact .nav-btn span::after{display:block;width:20px;height:2px;border-radius:2px;background:#fff;position:relative;transition:transform .25s,background .25s}
  .nav-compact .nav-btn span::before,.nav-compact .nav-btn span::after{content:"";position:absolute;left:0}
  .nav-compact .nav-btn span::before{top:-6px}.nav-compact .nav-btn span::after{top:6px}
  .nav-compact.nav-open .nav-btn span{background:transparent}
  .nav-compact.nav-open .nav-btn span::before{transform:translateY(6px) rotate(45deg)}
  .nav-compact.nav-open .nav-btn span::after{transform:translateY(-6px) rotate(-45deg)}
  .nav-compact .nav-backdrop{display:block;position:fixed;inset:0;z-index:24;background:rgba(10,20,50,.35);opacity:0;pointer-events:none;transition:opacity .25s}
  .nav-compact.nav-open .nav-backdrop{opacity:1;pointer-events:auto}
  .nav-compact .toc{position:fixed;top:0;right:0;bottom:0;z-index:25;margin:0;width:min(78vw,300px);max-width:none;flex-direction:column;gap:4px;
    padding:76px 16px 24px;border-radius:20px 0 0 20px;background:#fff;border:0;box-shadow:-10px 0 30px rgba(20,40,100,.18);
    transform:translateX(105%);transition:transform .3s ease;overflow-y:auto}
  .nav-compact.nav-open .toc{transform:none}
  .nav-compact .toc a{font-size:1rem;padding:12px 16px;border-radius:12px}
  body.nav-compact.nav-open{overflow:hidden}
main{max-width:960px;margin:0 auto;padding:28px 16px 40px}
.card{background:var(--card);border-radius:18px;padding:28px clamp(18px,4vw,36px);margin-bottom:22px;
  box-shadow:0 2px 12px rgba(10,25,90,.07);scroll-margin-top:64px}
h2{margin:0 0 14px;font-size:1.4rem;display:flex;align-items:center;gap:12px}
.sp-br{display:none}
@media (max-width:640px){.sp-br{display:inline}.pc-only{display:none}h2:has(.ttl){align-items:flex-start}h2:has(.ttl) .num{margin-top:.25em}}
.ttl{line-height:1.35}
.num{font-size:.85rem;color:#fff;background:var(--main);border-radius:8px;padding:2px 8px}
h3{font-size:1.08rem;margin:24px 0 8px;padding-left:10px;border-left:4px solid var(--main)}
h4{margin:0 0 6px}
.note{color:var(--muted);font-size:.88rem}
.card strong{background:linear-gradient(transparent 55%,var(--neon) 55%);padding:0 2px}
.callout{display:flex;gap:12px;align-items:flex-start;background:#f7f7f5;border-radius:12px;padding:16px 18px 16px 14px;margin:16px 0;
  color:#37352f;font-size:.95rem;line-height:1.7}
.callout.yellow{background:#fdf8e8}
.callout .icon{flex:none;font-size:1.25rem;line-height:1.5;width:1.6em;text-align:center}
.callout > div{flex:1;min-width:0}
.callout p{margin:0 0 6px}.callout p:last-child{margin:0}
@media (max-width:640px){.callout{flex-direction:column;gap:6px;padding:16px 18px}.callout .icon{width:auto;text-align:left}}
.badge{display:inline-block;background:#fff4d6;border-radius:8px;padding:2px 10px;font-size:.9rem}
.spec-list{margin:6px 0 14px;border-bottom:1px solid var(--line)}
.spec-list div{display:grid;grid-template-columns:8.5em 1fr;gap:16px;padding:14px 4px;border-top:1px solid var(--line)}
.spec-list div:has(dt:empty){border-top:1px dashed #dde4f2;padding-top:10px}
.spec-list dt{color:var(--muted);font-size:.85rem;font-weight:700;letter-spacing:.06em;padding-top:2px}
.spec-list dd{margin:0;font-weight:500}
.spec-list dd b{color:var(--main);font-weight:700}
@media (max-width:640px){.spec-list div{grid-template-columns:1fr;gap:2px}.spec-list dt:empty{display:none}}
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2vw,14px);margin:20px 0 4px}
.pillars div{background:#fff;color:var(--ink);border:1px solid #d5dcde;border-radius:14px;aspect-ratio:1/1;
  container-type:inline-size;padding:6%;display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;gap:3cqw}
.pillars .k{color:var(--ink);font-size:7.5cqw;font-weight:700;letter-spacing:.12em}
.pillars .v{font-size:min(17cqw,3.2rem);font-weight:900;line-height:1.2;color:var(--main);letter-spacing:.03em;white-space:nowrap}
.pillars .s{font-size:6cqw;color:var(--ink);line-height:1.4}
@media (max-width:640px){
  .pillars{grid-template-columns:1fr;gap:10px}
  .pillars div{aspect-ratio:auto;display:grid;grid-template-columns:5.2em 1fr;grid-template-rows:auto auto;column-gap:14px;row-gap:2px;
    align-items:center;justify-items:start;text-align:left;padding:16px 18px}
  .pillars .k{grid-row:1 / 3;font-size:.85rem;letter-spacing:.08em;align-self:center}
  .pillars .v{font-size:1.65rem;line-height:1.25}
  .pillars .s{font-size:.82rem}
}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.mini{border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.mini h3{margin-top:0;border:0;padding:0;color:var(--main);display:flex;align-items:center;gap:10px}
.ico-wrap{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--soft);color:var(--main);flex:none}
.ico{width:22px;height:22px}
.ng{border-radius:14px;padding:14px 18px;background:#fff6f6;border:1px solid #f5d5d5}
.ng h4{color:#c0392b}
.ng li::marker{content:"✕  ";color:#c0392b}
ul.check li::marker{content:"✓  ";color:var(--main)}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem;margin:8px 0}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--soft);color:var(--main-d);font-size:.82rem;letter-spacing:.04em}
.tbl td:first-child{white-space:nowrap}
.tbl td.todo{color:#b07a00;background:#fffaf0}
.timeline{list-style:none;margin:8px 0 0;padding:0 0 0 28px;position:relative}
.timeline::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:3px;border-radius:3px;
  background:#c5d3f7}
.timeline li{position:relative;padding:0 0 22px 14px;display:flex;flex-direction:column}
.timeline li::before{content:"";position:absolute;left:-25px;top:6px;width:14px;height:14px;border-radius:50%;
  background:#fff;border:3px solid var(--main)}
.timeline .when{font-size:.82rem;font-weight:700;color:var(--main);letter-spacing:.04em}
.timeline .what{font-size:1.05rem;background:none;padding:0}
.timeline .desc{color:var(--muted);font-size:.9rem}
.timeline li.key::before{background:var(--neon);border-color:var(--main);box-shadow:0 0 10px var(--neon)}
.timeline li.key .when{display:inline-block;align-self:flex-start;background:var(--main);color:#fff;padding:1px 10px;border-radius:6px}
.timeline li.key .what{background:linear-gradient(transparent 55%,var(--neon) 55%);align-self:flex-start;padding:0 2px}
.quota-wrap{container-type:inline-size}
.quota{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:10px 0 4px}
@container (max-width:820px){.quota{grid-template-columns:repeat(2,1fr)}}
@container (max-width:400px){.quota{grid-template-columns:1fr}}
.quota .q{background:var(--soft);border-radius:14px;padding:20px 12px 16px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.q-ico{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:#fff;color:var(--main)}
.q-ico .ico{width:28px;height:28px}
.q-name{font-weight:700;font-size:.95rem}
.q-num{white-space:nowrap;display:flex;align-items:baseline;justify-content:center;gap:3px;color:var(--main);font-weight:900;font-size:1.9rem;line-height:1.1}
.q-num small{font-size:.75rem;font-weight:700;color:var(--muted)}
.q-num .inf{width:30px;height:30px;align-self:center}
.q-num:has(.inf){align-items:center;font-size:1.3rem}
.q-note{font-size:.78rem;color:var(--muted);white-space:nowrap}
.scroll{overflow-x:auto}
.spec{min-width:560px}
.foot{text-align:center;color:var(--muted);font-size:.8rem;padding:20px 16px 40px}
.foot a{color:var(--main)}
</style>
</head>
<body>
<div id="gate">
  <form id="login" autocomplete="on">
    <h1>🔒 主辦限定頁面</h1>
    <p>請輸入 ID 與 PASSWORD 以瀏覽內容</p>
    <label for="uid">ID</label>
    <input id="uid" name="username" autocomplete="username" required autofocus>
    <label for="pw">PASSWORD</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required>
    <button id="btn" type="submit">登入</button>
    <div id="err" role="alert"></div>
  </form>
</div>
<div id="app"></div>

async function unlock(id, pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(id + ":" + pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const buf = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.data));
  return new TextDecoder().decode(buf);
}

/* ---------- 導覽：PC 懸浮＋目前位置／SP 漢堡選單 ---------- */
function initNav(app){
  const toc = app.querySelector(".toc"); if (!toc) return;
  toc.id = "site-nav";
  const btn = document.createElement("button");
  btn.className = "nav-btn"; btn.type = "button";
  btn.setAttribute("aria-label", "開啟目錄"); btn.setAttribute("aria-controls", "site-nav"); btn.setAttribute("aria-expanded", "false");
  btn.innerHTML = "<span></span>";
  const bd = document.createElement("div"); bd.className = "nav-backdrop";
  app.append(btn, bd);
  const set = open => {
    document.body.classList.toggle("nav-open", open);
    btn.setAttribute("aria-expanded", String(open)); btn.setAttribute("aria-label", open ? "關閉目錄" : "開啟目錄");
  };
  btn.onclick = () => set(!document.body.classList.contains("nav-open"));
  bd.onclick = () => set(false);
  toc.addEventListener("click", e => { if (e.target.closest("a")) set(false); });
  addEventListener("keydown", e => { if (e.key === "Escape") set(false); });
  // 目錄放不下時切換成漢堡選單（依實際寬度判斷，不限裝置）
  let need = 0;
  const measure = () => {                          // 量目錄完整寬度（只在初始化與字型載入後）
    const b = document.body, was = b.classList.contains("nav-compact");
    b.classList.add("nav-measuring"); b.classList.remove("nav-compact");
    need = toc.scrollWidth + 32;                   // ＋左右留白
    b.classList.toggle("nav-compact", was); void toc.offsetWidth;
    requestAnimationFrame(() => b.classList.remove("nav-measuring"));
  };
  const fit = () => {
    const compact = need > document.documentElement.clientWidth;
    if (!compact && document.body.classList.contains("nav-open")) set(false);
    document.body.classList.toggle("nav-compact", compact);
  };
  measure(); fit(); addEventListener("resize", fit);
  document.fonts?.ready.then(() => { measure(); fit(); });
  // 目前位置標示
  const links = [...toc.querySelectorAll('a[href^="#"]')];
  const map = new Map(links.map(a => [a.getAttribute("href").slice(1), a]));
  const secs = [...map.keys()].map(id => document.getElementById(id)).filter(Boolean);
  const mark = () => {
    let cur = secs[0];
    for (const s of secs) if (s.getBoundingClientRect().top < innerHeight * 0.35) cur = s;
    links.forEach(a => a.classList.toggle("active", map.get(cur?.id) === a));
    const act = map.get(cur?.id);
    if (act && getComputedStyle(toc).flexDirection === "row") toc.scrollTo({left: act.offsetLeft - toc.clientWidth/2 + act.clientWidth/2, behavior: "smooth"});
  };
  addEventListener("scroll", mark, {passive:true}); mark();
}

function initWater(hero){

uniform vec2 R; uniform float T;
float hash(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
  return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y);
}
float fbm(vec2 p){ float v = 0.0, a = 0.5; for(int k=0;k<5;k++){ v += a*noise(p); p = p*2.03 + 7.1; a *= 0.5; } return v; }
vec2 hash2(vec2 p){ return vec2(hash(p), hash(p+19.19)); }
// 柔焦光斑（Worley）：每顆大小隨機、緩慢游移；回傳 (核心亮度, 光暈)
vec2 dapple(vec2 p, float t){
  vec2 i = floor(p), f = fract(p); float core = 0.0, glow = 0.0;

    float r = mix(0.20, 0.85, pow(hash(i+n+7.7), 1.4));      // 隨機半徑：小光點多、大光斑少
    vec2 o = 0.5 + 0.34*sin(t*0.6 + 6.2831*h);

    core = max(core, (1.0 - smoothstep(r*0.12, r, d)) * (0.75 + 0.25*h.x));   // 邊緣拉長＝更模糊

  gl.useProgram(pr);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, "a"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const uR = gl.getUniformLocation(pr, "R"), uT = gl.getUniformLocation(pr, "T");
  const resize = () => {
    const d = Math.min(devicePixelRatio || 1, 1.5);
    cv.width = Math.round(hero.clientWidth * d); cv.height = Math.round(hero.clientHeight * d);
    gl.viewport(0, 0, cv.width, cv.height); gl.uniform2f(uR, cv.width, cv.height);
  };
  resize(); addEventListener("resize", resize);
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let visible = true, raf = 0; const t0 = performance.now();
  const draw = now => { gl.uniform1f(uT, (now - t0) / 1000 * 0.5 + 10.0); gl.drawArrays(gl.TRIANGLES, 0, 3); };
  const loop = now => { draw(now); raf = visible ? requestAnimationFrame(loop) : 0; };
  if (still) { draw(t0); return; }
  new IntersectionObserver(([e]) => { visible = e.isIntersecting; if (visible && !raf) raf = requestAnimationFrame(loop); }).observe(hero);
  raf = requestAnimationFrame(loop);
}
document.getElementById("login").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("btn"), err = document.getElementById("err");
  const id = document.getElementById("uid").value.trim(), pw = document.getElementById("pw").value;
  btn.disabled = true; err.textContent = "";
  try {
    render(await unlock(id, pw));
    sessionStorage.setItem(AUTH_KEY, JSON.stringify([id, pw]));
  } catch { err.textContent = "ID 或 PASSWORD 錯誤"; btn.disabled = false; }
});
(async () => {
  const saved = sessionStorage.getItem(AUTH_KEY);
  if (!saved) return;
  try { render(await unlock(...JSON.parse(saved))); } catch { sessionStorage.removeItem(AUTH_KEY); }
})();
